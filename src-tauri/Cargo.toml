[package]
name = "markdown-quick-memo"
version = "2.0.0"
description = "Keyboard-first Markdown memo editor for Windows"
authors = ["Markdown Quick Memo contributors"]
edition = "2024"
rust-version = "1.97"
default-run = "MarkdownQuickMemo"

[lib]
name = "markdown_quick_memo"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "MarkdownQuickMemo"
path = "src/main.rs"

[[bin]]
name = "MarkdownQuickMemoHotkey"
path = "src/hotkey_main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.23.0"
log = "=0.4.28"
mime_guess = "=2.0.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-log = "=2.9.0"
tauri-plugin-single-instance = "=2.4.3"
tempfile = "=3.23.0"
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = "=0.61.3"
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
